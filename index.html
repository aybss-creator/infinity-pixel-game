<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pixel Infinity</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <canvas id="game" width="960" height="540" aria-label="Pixel infinity runner game"></canvas>
      <div class="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Best: <span id="best">0</span></div>
      </div>
      <div id="message" class="message visible">
        Tap or press <strong>Space</strong> to jump<br />
        Press <strong>Enter</strong> to restart
      </div>
      <button id="jumpButton" type="button" aria-label="Jump">JUMP</button>
    </div>

    <script src="game.js"></script>
  </body>
</html>
